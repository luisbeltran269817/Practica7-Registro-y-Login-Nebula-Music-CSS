<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width", initial scale="1.0">
  <style>

    .contenedor-basico {
      display: grid;
      grid-template-columns: 100px 100px 100px;
      gap: 10px;
      border: 2px solid black;
      padding: 10px;
      background-color: #f9f9f9;
      margin-bottom: 30px;
    }

    .caja-basica{
      height: 100px;
      background-color: blue;
      display:flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    /*pantalla de laptop: 1024px*/
    /*pantalla de movil promedio: 480px*/
    /*pantalla de tablet promedio: 768px*/
    @media(max-width: 480px){
      body {
        background-color: black;
      }

      .contenedor-basico{
        grid-template-columns: 100px 100px;
      }
    }

    @media(min-width: 768px){
      body{
        background-color: #8d3fd1;
      }
    }

    @media(width>=768px){

    }

    @media(480px < width < 768px){
      body{
        background-color: deeppink;
      }
    }

    .parent{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      grid-template-rows: repeat(4, 100px);
      gap:5px;
      max-width: 500px;
      border:2px solid black;
      padding:5px;
      background-color: #f9f9f9;
    }

    .parent div{
      border: 10px solid black;
      background-color:#EDF67D;
      display:flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .div1{
      /*fila inicio, columna inicio, fila fin, columna fin*/
      grid-area:1/1/3/2;
    }

    .div2{
      grid-area:1/2/3/4;
    }

    .div3{
      grid-area:1/4/2/-1;
    }

    .div4{
      grid-area:2/4/3/-1;
    }

    .div5{
      grid-area:3/1/5/3;
    }

    .div6{
      grid-area:3/3/4/-1;
    }

    .div7{
      grid-area:4/3/5/-1;
    }

  </style>
</head>
<body>
<!--  <div class="contenedor-basico">-->
<!--    <div class="caja-basica">1</div>-->
<!--    <div class="caja-basica">2</div>-->
<!--    <div class="caja-basica">3</div>-->
<!--    <div class="caja-basica">4</div>-->
<!--    <div class="caja-basica">5</div>-->
<!--    <div class="caja-basica">6</div>-->
<!--  </div>-->
  <div class="parent">
    <div class="div1">1</div>
    <div class="div2">2</div>
    <div class="div3">3</div>
    <div class="div4">4</div>
    <div class="div5">5</div>
    <div class="div6">6</div>
    <div class="div7">7</div>
  </div>
</body>
</html>
